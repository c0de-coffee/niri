# Greeter users for remote-dm: one per remote connection at the login screen at a time.
# Concurrent sessions of one user would share its session bus, hence several users.
# Add more (rdm-greeter-5, ...) to allow more connections at the login screen at once.

# All of them, for access to greeter state shared with local greeters (see tmpfiles.d).
g rdm-greeter -

u rdm-greeter-1 - "remote-dm greeter" /var/lib/rdm-greeter-1 /usr/bin/nologin
m rdm-greeter-1 video
m rdm-greeter-1 render
m rdm-greeter-1 rdm-greeter
u rdm-greeter-2 - "remote-dm greeter" /var/lib/rdm-greeter-2 /usr/bin/nologin
m rdm-greeter-2 video
m rdm-greeter-2 render
m rdm-greeter-2 rdm-greeter
u rdm-greeter-3 - "remote-dm greeter" /var/lib/rdm-greeter-3 /usr/bin/nologin
m rdm-greeter-3 video
m rdm-greeter-3 render
m rdm-greeter-3 rdm-greeter
u rdm-greeter-4 - "remote-dm greeter" /var/lib/rdm-greeter-4 /usr/bin/nologin
m rdm-greeter-4 video
m rdm-greeter-4 render
m rdm-greeter-4 rdm-greeter
