# Homes of remote-dm's greeter users (see sysusers.d/remote-dm.conf).
d /var/lib/rdm-greeter-1 0700 rdm-greeter-1 rdm-greeter-1 -
d /var/lib/rdm-greeter-2 0700 rdm-greeter-2 rdm-greeter-2 -
d /var/lib/rdm-greeter-3 0700 rdm-greeter-3 rdm-greeter-3 -
d /var/lib/rdm-greeter-4 0700 rdm-greeter-4 rdm-greeter-4 -

# Noctalia Greeter keeps its state in /var/lib/noctalia-greeter, which belongs to the local greetd
# user ("greeter"). Our greeter users need to read and write it too (it exits when it can't save
# the last user). New files stay usable for the greeter group. Skipped if it isn't installed.
A+ /var/lib/noctalia-greeter - - - - g:rdm-greeter:rwX,d:g:rdm-greeter:rwX,d:g:greeter:rwX
