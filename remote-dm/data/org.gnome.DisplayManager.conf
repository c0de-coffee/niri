<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- remote-dm stands in for GDM's remote display support. Only root may own the name;
     only gnome-remote-desktop's system daemon (and root) may talk to it. remote-dm also
     checks the caller of CreateRemoteDisplay itself. -->
<busconfig>
  <policy user="root">
    <allow own="org.gnome.DisplayManager"/>
    <allow send_destination="org.gnome.DisplayManager"/>
  </policy>
  <policy user="gnome-remote-desktop">
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.gnome.DisplayManager.RemoteDisplayFactory"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.gnome.DisplayManager"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
