[package]
name = "remote-dm"
version = "0.1.0"
edition = "2021"
# GPL-3.0-only because it includes code from greetd (src/pam, src/scrambler.rs).
license = "GPL-3.0-only"
description = "Remote login display manager: GDM's remote display interface for gnome-remote-desktop, greetd's IPC for greeters"

# Not part of the niri workspace.
[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", features = ["user", "process", "signal", "fs"] }
pam-sys = "0.5.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "process", "net", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
